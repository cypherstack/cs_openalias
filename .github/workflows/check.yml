name: OpenAlias integration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: '3.10.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: cs_openalias
      # The core packages remain unpublished; test exact reviewed revisions.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: cypherstack/openalias
          ref: 46d8402773fe3e85f15e4f0be97b92fddcd0a70e
          path: openalias
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: cypherstack/dnssec_resolver
          ref: 8e133d6a60acc5f15ce88fb2d7c9acd603896c55
          path: dnssec_resolver
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: cypherstack/doh_transport
          ref: 3dbac4862762f62cb15a01a064b6861a77bb56ea
          path: doh_transport
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}
      - shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - shell: bash
        working-directory: cs_openalias
        run: |
          overrides() {
            echo 'dependency_overrides:'
            for package in openalias dnssec_resolver doh_transport; do
              printf '  %s:\n    path: %s/%s\n' "$package" "$1" "$package"
            done
          }
          overrides .. > pubspec_overrides.yaml
          overrides ../.. > example/pubspec_overrides.yaml
      - run: dart tool/check.dart
        working-directory: cs_openalias
